name: Run Tests and Lints

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test_pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache Node dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install asdf requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libreadline-dev uuid-dev

      - name: Setup asdf
        uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Cache asdf tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.asdf
          key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Rerun Pre-Commit Hooks on CI
        run: |
          pip install -r requirements.txt
          asdf reshim
          pre-commit run --color=always --show-diff-on-failure --all-files

      - name: Install dependencies for the authz package
        run: make authz_install

      - name: Run authz package tests
        run: make authz_test

      - name: Install dependencies for frontend
        run: make app_install

      - name: Run frontend unit tests
        run: |
          yarn test --coverage
        working-directory: ./app

      - name: Setup postgres
        env:
          PGUSER: postgres
        run: |
          pg_ctl start
          createdb runner || true
          psql -U postgres -c "drop database if exists ssorequests_test"
          chmod +x ./db-setup.sh
          ./db-setup.sh ssorequests_test

        working-directory: ./.bin

      - name: Run Database Migrations
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: ssorequests_test
          DB_HOSTNAME: localhost
        run: |
          make db_install && make db_compile && make migrations
        working-directory: .

      - name: Run backend integration tests
        env:
          PGUSER: postgres
          DATABASE_URL: 'postgresql://localhost:5432/ssorequests_test'
        run: |
          yarn test-api --coverage
        working-directory: ./app

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        env:
          slug: bcgov/sso-requests
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./app/coverage/lcov.info, ./lambda/coverage/lcov.info
          flags: unitests
          name: codecov
          fail_ci_if_error: false
          verbose: true

      - name: Install dependencies for api
        run: |
          yarn install
        working-directory: ./api

      - name: Run api integration tests
        env:
          PGUSER: postgres
          DATABASE_URL: 'postgresql://localhost:5432/ssorequests_test'
        run: |
          yarn test
        working-directory: ./api

  commitlint:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@9763196e10f27aef304c9b8b660d31d97fce0f99 # v5.5.1

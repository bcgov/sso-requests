name: Set CSS in Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'The target branch from which to deploy'
        required: true
        type: choice
        options: ['dev', 'prod']
        default: 'dev'
      maintenanceEnabled:
        description: 'If true, the CSS app will be in maintenance mode.'
        type: boolean
        required: false
        default: false

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: bcgov/sso-requests

permissions:
  contents: read

jobs:
  build-and-push-image:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install CLI tools from OpenShift Mirror
        uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 # v1.13.1
        with:
          source: mirror
          kam: latest
          oc: 4.18.7

      - name: Set env to development
        if: ${{endsWith(github.ref,'/dev') && github.event.inputs.environment  == 'dev' }}
        run: |
          cat >> $GITHUB_ENV <<EOF
          OPENSHIFT_NAMESPACE=${{ secrets.DEV_OPENSHIFT_NAMESPACE }}
          EOF

      - name: Set env to production
        if: ${{endsWith(github.ref,'/main') && github.event.inputs.environment  == 'prod' }}
        run: |
          cat >> $GITHUB_ENV <<EOF
          OPENSHIFT_NAMESPACE=${{ secrets.PROD_OPENSHIFT_NAMESPACE }}
          EOF

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@5eb45e848b168b6bf6b8fe7f1561003c12e3c99d # v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Set CSS Maintenance Mode to Active or Inactive
        run: |
          namespace=${{ env.OPENSHIFT_NAMESPACE }}
          maintenanceEnabled=${{ github.event.inputs.maintenanceEnabled }}
          oc set env deployment/sso-requests MAINTENANCE_MODE_ACTIVE=${maintenanceEnabled} -n ${namespace}
          oc set env deployment/sso-requests-api MAINTENANCE_MODE_ACTIVE=${maintenanceEnabled} -n ${namespace}
        working-directory: .

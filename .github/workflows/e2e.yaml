  # Playwright suite (e2e/). Logs in against the local keycloak, so it needs no secrets or external IdPs.
  # Runs alongside the Cypress job until it has proven stable; see e2e/README.md.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Start the e2e stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Install e2e dependencies
        run: yarn install --frozen-lockfile --ignore-scripts && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Wait for keycloak provisioning and the app
        run: |
          set -euo pipefail
          for c in dev-kc-migration test-kc-migration prod-kc-migration; do
            until [ "$(docker inspect -f '{{.State.Status}}' "$c")" = "exited" ]; do sleep 5; done
            code=$(docker inspect -f '{{.State.ExitCode}}' "$c")
            if [ "$code" != "0" ]; then docker logs "$c" | tail -50; echo "::error::$c failed"; exit 1; fi
          done
          timeout 300 bash -c 'until curl -sf -o /dev/null http://localhost:3000/api/heartbeat; do sleep 5; done'

      - name: Run Playwright (ci tier)
        run: npx playwright test --project=ci
        working-directory: e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: App logs on failure
        if: ${{ failure() }}
        run: docker logs sso-requests 2>&1 | tail -300

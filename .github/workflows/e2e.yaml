name: Run E2E tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - app/**
      - Dockerfile
      - docker-compose.yml
      - .github/workflows/e2e.yaml
      - local/terraform/**
      - docker-compose.e2e.yml
      - e2e/**

env:
  CYPRESS_host: 'http://localhost:3000'
  CYPRESS_smoketest: true
  CYPRESS_localtest: true
  CYPRESS_BASE_URL: 'http://localhost:3000'

permissions:
  contents: read

